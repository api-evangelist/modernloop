name: ModernLoop
description: >-
  ModernLoop is an automated interview scheduling and recruiting-operations
  platform for talent-acquisition teams, now paired with "Taylor AI," a
  configurable AI recruiting agent. It coordinates interviewer calendars,
  balances load, and schedules complex interview loops across time zones to cut
  time-to-hire and improve candidate experience. ModernLoop integrates deeply
  with applicant tracking systems (Greenhouse, Lever, Ashby, Workday,
  SmartRecruiters, Avature), calendar and video tools (Google, Microsoft
  Outlook/Teams, Zoom, Google Meet), communication (Slack, Gmail), coding
  assessment (CoderPad, CodeSignal, Codility, HackerRank), and SSO providers
  (Okta, Microsoft Entra ID). The platform is delivered as SaaS: it consumes
  partner APIs but does not publish a public developer API, SDK, or MCP server.
  Backed by Accel. This profile was enriched from ModernLoop's public site,
  trust center, and status page.
